<div id="content-blogs" class="fade-in-top content-div">
    <div id='header-div2' class='project-grid'{% if open_post %} style="display: none;"{% endif %}>
        {% for blog in blogs %}
            <div class='project-card' data-url="{% url 'blog_post' slug_id=blog.slug %}" data-title="{{ blog.title }}"
                 hx-get="{% url 'blog_post' slug_id=blog.slug %}" hx-swap="innerHTML" hx-target="#blog-div" hx-on:click="show_blog_post(this)">
                <div class="project-card-top">
                    {% if blog.date %}<span class="project-card-date">{{blog.date|date:"M j, Y"}}</span>{% endif %}
                    <h3>{{blog.title}}</h3>
                </div>
                <p class="project-card-desc">{{blog.description}}</p>
            </div>
        {% endfor %}
    </div>
    <div id="blog-div"{% if not open_post %} style="display: none;"{% endif %}>
        {% if open_post %}{% include "new_main/blog_post.html" with title=open_post.title date=open_post.date content=open_post.content %}{% endif %}
    </div>
</div>

<script>
function show_blog_list(){
    $('#header-div2').show();
    $('#blog-div').hide();
    setLocation("{% url 'blogs' %}", $('#header-blogs').text());
}

function show_blog_post(card){
    $('#header-div2').hide();
    $('#blog-div').show();
    setLocation(card.dataset.url, card.dataset.title);
}
</script>
