<div id="content-projects" class="fade-in-top content-div">
    <p>Below are all the projects I've made.</p>
    <div id="project-filters" class="project-filters" role="group" aria-label="Filter projects">
        <button type="button" class="project-filter-btn active" id="project-filter-all" data-tag="" aria-pressed="true">All</button>
        {% for tag in project_tags %}
            <button type="button" class="project-filter-btn" id="{% if tag.id == 'game' %}games{% else %}{{ tag.id }}{% endif %}" data-tag="{{ tag.id }}" aria-pressed="false">{{ tag.label }}</button>
        {% endfor %}
    </div>
    <div class="project-grid">
        {% for project in projects %}
            {% include "new_main/project_card.html" %}
        {% endfor %}
    </div>
</div>
