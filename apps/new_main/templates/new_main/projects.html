<div id="content-projects" class="fade-in-top content-div">
    <p>Below are all the projects I've made.</p>
    <div class="project-grid">
        {% for project in projects %}
            <a class="project-card" href="{% if project.url %}{{ project.url }}{% else %}{% url 'project_post' slug_id=project.slug %}{% endif %}">
                <div class="project-card-top">
                    <h3>{{project.title}}</h3>
                    <span class="project-card-date">{{ project.date|date:"M Y" }}</span>
                </div>
                <p class="project-card-desc">{{project.description}}</p>
            </a>
        {% endfor %}
    </div>
</div>
