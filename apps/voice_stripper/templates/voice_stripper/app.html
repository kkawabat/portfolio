{% load static %}
<div id="content-app" class="content-div project">
    <h3 class="voice-stripper-headline">Remove vocal from YouTube video</h3>
    <input id="csrf_token" type="hidden" value="{{ csrf_token }}">
    <input type="url" id="youtube-link" name="youtube-link" placeholder="link a YouTube song with vocal here..." value="https://www.youtube.com/watch?v=r2gRJbKUh-I&list=PLHPfyr5itAvsXOUomW_dwxjUIfxyhQplx&index=1&ab_channel=AudioKings">
    <button class='app-button' id="strip-btn">Strip Vocal!</button>
    <audio id="stripped-audio" controls hidden></audio>
</div>
