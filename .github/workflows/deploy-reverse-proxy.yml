name: Deploy Reverse Proxy

on:
  push:
    branches: [ main, master ]
    paths:
      - 'reverse-proxy/**'
      - '.github/workflows/deploy-reverse-proxy.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'reverse-proxy/**'
      - '.github/workflows/deploy-reverse-proxy.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy-reverse-proxy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Show trigger information
      run: |
        echo "🔍 Workflow triggered by:"
        if [ "${{ github.event_name }}" == "push" ]; then
          echo "  📤 Push event to branch: ${{ github.ref }}"
          echo "  📁 Changed paths: ${{ toJson(github.event.head_commit.modified) }}"
        elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "  🔧 Manual trigger"
        fi

    - name: Validate Caddyfile template
      run: |
        # Basic validation of Caddyfile template (no Caddy installation needed)
        if [ -f "reverse-proxy/Caddyfile.template" ]; then
            echo "✅ Caddyfile template found"
            # Check for basic syntax issues
            if grep -q "\$DOMAIN" reverse-proxy/Caddyfile.template; then
                echo "✅ Caddyfile template contains required variables"
            else
                echo "❌ Caddyfile template missing required variables"
                exit 1
            fi
            echo "✅ Caddyfile template validation passed"
        else
            echo "❌ Caddyfile template not found"
            exit 1
        fi

    - name: Deploy Reverse Proxy to Droplet
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DROPLET_HOST }}
        username: ${{ secrets.DROPLET_USER }}
        key: ${{ secrets.DROPLET_SSH_KEY }}
        port: ${{ secrets.DROPLET_PORT || 22 }}
        envs: DOMAIN,CADDY_EMAIL,AUTO_HTTPS,LOG_LEVEL,ADMIN_API,PORTFOLIO_CONTAINER,PORTFOLIO_PORT
        script: |
          # Ensure portfolio repository is up to date
          echo "📥 Updating portfolio repository..."
          cd /opt/portfolio
          
          # Handle any local changes that might conflict with the pull
          if ! git diff --quiet; then
            echo "⚠️ Local changes detected, stashing them..."
            git stash push -m "Auto-stash before deployment $(date)"
          fi
          
          # Pull the latest changes
          if git pull origin main; then
            echo "✅ Repository updated successfully"
          else
            echo "❌ Failed to update repository"
            exit 1
          fi
          
          # Set environment variables for the deployment script
          export DOMAIN="${{ secrets.DOMAIN }}"
          export CADDY_EMAIL="${{ secrets.CADDY_EMAIL }}"
          export AUTO_HTTPS="on"
          export LOG_LEVEL="INFO"
          export ADMIN_API="off"
          export PORTFOLIO_CONTAINER="portfolio-app"
          export PORTFOLIO_PORT="8000"
          
          # Run the deployment script
          cd /opt/portfolio/reverse-proxy
          ./deploy.sh

    - name: Verify Deployment
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DROPLET_HOST }}
        username: ${{ secrets.DROPLET_USER }}
        key: ${{ secrets.DROPLET_SSH_KEY }}
        port: ${{ secrets.DROPLET_PORT || 22 }}
        envs: DOMAIN
        script: |
          # Set environment variables for the health check script
          export DOMAIN="${{ secrets.DOMAIN }}"
          
          # Run the health check script
          cd /opt/portfolio/reverse-proxy
          ./health-check.sh

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Reverse proxy deployment successful!"
          echo "🌐 Your reverse proxy is now running with automatic HTTPS"
        else
          echo "❌ Reverse proxy deployment failed!"
          echo "🔍 Check the logs above for troubleshooting information"
        fi
