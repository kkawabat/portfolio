name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "*.md"
      - ".cursor/**"
  workflow_dispatch:

# Serialize deploys so concurrent pushes cannot race on the same Cloud Run
# service revision. Queue runs (do not cancel) so every main commit ships.
concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: kan-kawabata-2026
  REGION: us-west1
  SERVICE: portfolio
  WORKERS_SERVICE: portfolio-workers
  REPOSITORY: portfolio

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push portfolio image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest .
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: Build and push workers image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.WORKERS_SERVICE }}
          docker build -t ${IMAGE}:${{ github.sha }} -t ${IMAGE}:latest workers/
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest

      - name: Deploy to Cloud Run
        run: |
          deploy_cloud_run() {
            gcloud run deploy "$1" \
              --image "$2" \
              --region "${{ env.REGION }}" \
              --update-labels "managed-by=github-actions,commit-sha=${{ github.sha }}" \
              --quiet
          }

          retry_deploy() {
            local service="$1"
            local image="$2"
            local max_attempts=5
            local wait_secs=30

            for attempt in $(seq 1 "$max_attempts"); do
              if deploy_cloud_run "$service" "$image"; then
                echo "Deployed ${service} on attempt ${attempt}"
                return 0
              fi

              if [[ "$attempt" -lt "$max_attempts" ]]; then
                echo "Deploy ${service} attempt ${attempt} failed; retrying in ${wait_secs}s..."
                sleep "$wait_secs"
              fi
            done

            echo "Deploy ${service} failed after ${max_attempts} attempts"
            return 1
          }

          WORKERS_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.WORKERS_SERVICE }}:${{ github.sha }}"
          PORTFOLIO_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

          retry_deploy "${{ env.WORKERS_SERVICE }}" "$WORKERS_IMAGE"
          retry_deploy "${{ env.SERVICE }}" "$PORTFOLIO_IMAGE"
