version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile configuration (generated from template)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # SSL certificates (persistent storage)
      - caddy_data:/data
      - caddy_config:/config
      # Logs
      - ./logs:/var/log/caddy
    environment:
      # Email for Let's Encrypt
      - CADDY_EMAIL=kkawabat@asu.edu
    # Connect to the same network as your other projects
    networks:
      - portfolio_network
      - default
    # Resource limits for small droplet
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    # Health check
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=50m

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  portfolio_network:
    external: true
    name: portfolio_default
