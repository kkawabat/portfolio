[project]
name = "portfolio-workers"
version = "0.1.0"
description = "Long-running processing workers for portfolio demos"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1",
    "numpy>=2",
    "scipy>=1.14",
    "yt-dlp>=2024",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "pandas>=2",
    "chat-downloader>=0.2.7",
    "google-api-python-client>=2.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
