[project]
name = "portfolio"
version = "0.1.0"
description = "Personal portfolio website for Kan Kawabata"
readme = "CONTEXT.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "pillow>=10",
    "python-dotenv>=1",
    "mistune>=3",
    "pygments>=2.15",
    "gunicorn>=23",
    "gevent>=24",
    "whitenoise>=6.5",
    "google-api-python-client>=2.97",
    "google-auth-oauthlib>=1",
    "requests>=2.32",
    "boto3>=1.28",
    "vadersentiment>=3.3",
    "magic-eye-util",
    "morse-code-util",
    "whistle-detector",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.2",
]

[tool.uv.sources]
magic-eye-util = { git = "https://github.com/kkawabat/MagicEyeUtil.git" }
morse-code-util = { git = "https://github.com/kkawabat/Morse-Code-Util.git" }
whistle-detector = { git = "https://github.com/kkawabat/WhistleDetector.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
