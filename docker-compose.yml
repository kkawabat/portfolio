services:
  portfolio:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DJANGO_DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - portfolio_db:/app/db_data
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

volumes:
  portfolio_db:
    driver: local
