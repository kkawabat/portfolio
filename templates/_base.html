{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="htmx-config" content='{"historyCacheSize": 0, "refreshOnHistoryMiss": false}'>

    <title>{% block title %}Kan Kawabata{% endblock title %}</title>
    
    <!-- Local vendor assets for better security and performance -->
    <script src="{% static 'vendor/jquery-3.7.0.min.js' %}"></script>
    <link href="{% static 'vendor/font-awesome-5.0.10.min.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'vendor/bootstrap-5.2.1.min.css' %}" rel="stylesheet">
    <script src="{% static 'vendor/bootstrap-5.2.1.bundle.min.js' %}"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/common_animations.css' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.png' %}">
    <link rel="icon" href="{% static 'images/favicon.png' %}">
    <script src="{% static 'vendor/htmx-1.9.4.min.js' %}"></script>

    <script src="{% static 'js/nav_selector_logic.js' %}"></script>
    <script src="{% static 'js/visit_logic.js' %}"></script>
    {% block ref %}{% endblock ref %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% block body %}{% endblock body %}
    {% include "_build_stamp.html" %}
    <button onclick="topFunction()" id="jumpToTopBtn" title="Go to top">Top</button>
    <script src="{% static 'js/jump_to_top_button.js' %}"></script>
</body>
</html>
